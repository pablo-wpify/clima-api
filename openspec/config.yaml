schema: spec-driven

context: |
  Escribir todos los documentos de OpenSpec (propuestas, specs, diseños y tareas) en español.
  Los identificadores de código (clases, métodos, variables, archivos, rutas) siguen las convenciones habituales de Ruby y Rails, en inglés.
  Clima API es una API Rails educativa que consultará Open-Meteo a partir de coordenadas y devolverá temperatura y viento con unidades explícitas.
  Versiones seleccionadas: Ruby 4.0.9, Rails 8.1.4 y Node 24.8.0 (fijadas con asdf en .tool-versions).
  Stack: RSpec para tests, Faraday para HTTP, service objects invocados con ApplicationService.call y objetos Data de Ruby para los resultados.
  Primer corte sin base de datos, sin autenticación propia, sin caché y sin reintentos.
  La implementación debe preservar los archivos existentes de openspec/ y .claude/; no sobrescribirlos ni regenerarlos.

# Project context (optional)
# Add only constraints that should guide OpenSpec artifacts and workflows.
# Include constraints an agent cannot infer by reading the code.
# Keep general project documentation and discoverable codebase facts out.
# Example:
#   context: |
#     Designs and tasks must cover Windows, macOS, and Linux
#     Write all artifacts in Spanish

# Per-artifact rules (optional)
# Add custom rules for specific artifacts.
# Example:
#   rules:
#     proposal:
#       - Keep proposals under 500 words
#       - Always state what is out of scope
#     tasks:
#       - Break tasks into chunks of max 2 hours

# Per-operation guidance (optional)
# Add advisory guidance for how apply and archive work should be conducted.
# This is separate from artifact rules above.
# Example:
#   operations:
#     apply:
#       guidance:
#         - Keep test summaries concise
#     archive:
#       guidance:
#         - Summarize the archive outcome before finishing
